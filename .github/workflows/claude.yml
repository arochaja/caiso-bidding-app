name: Claude

# Runs when someone mentions @claude in an issue, an issue/PR comment,
# or a pull-request review. Claude only acts on comments that contain the
# trigger phrase "@claude" — nothing happens on ordinary activity.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Skip runs unless the triggering text actually mentions @claude.
    # (The action also verifies this, but gating here saves Actions minutes.)
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # let Claude push commits / branches
      issues: write          # comment on and label issues
      pull-requests: write   # open and comment on PRs
      id-token: write        # OIDC, used by the action
      actions: read          # read workflow run data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Authenticates against your Claude subscription (not API billing).
          # Generate the token with `claude setup-token` and store it as the
          # repo secret CLAUDE_CODE_OAUTH_TOKEN.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
