name: Claude Code Review

# Lever 3: automatic AI code review of pull requests — no @claude mention needed.
# Posts inline line comments + a summary comment.
#
# Scope is deliberately correctness/security only — ruff (Lever 1) already owns
# style/formatting, and the local Stop-hook review (Lever 2) already covers
# work-in-progress on branches, so this is purely the PR-time gate.
#
# NOTE: claude-code-action@v1 only supports PR/issue/comment events, and the
# workflow file must exist with identical content on the default branch for the
# action to run (GitHub security validation) — so keep main + PR branch in sync.
# The mention-triggered workflow lives in claude.yml and is unchanged.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write   # inline + summary comments
  issues: write          # progress-tracking comment
  id-token: write        # OIDC used by the action

jobs:
  pr-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          classify_inline_comments: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a code review of this pull request. First run `gh pr diff`
            to fetch the diff, then review it as a meticulous senior engineer on
            a Python data app (Streamlit + DuckDB).

            Focus ONLY on things that need judgment:
            1. Real correctness bugs and wrong assumptions
            2. Security issues — unsafe SQL, unvalidated input
            3. Silent data loss and edge-case / off-by-one errors
            Do NOT comment on style or formatting — ruff already enforces those.

            Post inline comments on the specific lines using the inline comment
            tool, with concrete suggestions. Then post one concise summary
            comment. If the diff looks good, post a short summary saying so.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
