name: Claude Code Review

# Lever 3: automatic AI code review of pull requests — no @claude mention needed.
# Minimal form: a direct review prompt, no track_progress orchestration.
#
# Scope is correctness/security only — ruff (Lever 1) owns style, and the local
# Stop-hook review (Lever 2) covers work-in-progress on branches.
#
# NOTE: claude-code-action@v1 only runs when this file exists with IDENTICAL
# content on the default branch (GitHub security validation) — keep main + PR
# branch in sync. The mention-triggered workflow lives in claude.yml (unchanged).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  pr-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request for real correctness bugs, unsafe SQL /
            input handling, silent data loss, and edge-case errors. Ignore style
            (ruff already enforces it). Run `gh pr diff` to see the changes, then
            leave inline comments on the specific problem lines and post one
            concise summary comment. If it looks good, say so briefly.
          claude_args: '--allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"'
