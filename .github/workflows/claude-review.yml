name: Claude Code Review

# Lever 3: automatic AI code review of pull requests — no @claude mention needed.
# Posts a summary (via the tracked review comment) + inline line comments.
#
# Lever 5 (lightest): also surfaces the review CONTEXT, not just the diff —
# uploads the agent's full transcript as an artifact and posts a link to the
# review conversation into Slack #all-caiso-code. When code is AI-generated the
# conversation is the real work, so we keep it reviewable, not just the result.
#
# Scope is correctness/security only — ruff (Lever 1) owns style, and the local
# Stop-hook review (Lever 2) covers work-in-progress on branches.
#
# NOTE: claude-code-action@v1 only runs when this file exists with IDENTICAL
# content on the default branch (GitHub security validation) — keep main + PR
# branch in sync. `track_progress: true` is required: it wires up the
# comment-posting path (without it, posting tools are permission-denied).
# The mention-triggered workflow lives in claude.yml (unchanged).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  pr-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          classify_inline_comments: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a code review of this pull request. Run `gh pr diff` to fetch
            the diff, then review it as a meticulous senior engineer on a Python
            data app (Streamlit + DuckDB).

            Focus ONLY on things that need judgment:
            1. Real correctness bugs and wrong assumptions
            2. Security issues — unsafe SQL, unvalidated input
            3. Silent data loss and edge-case / off-by-one errors
            Do NOT comment on style or formatting — ruff already enforces those.

            Post inline comments on the specific problem lines using the inline
            comment tool, with concrete suggestions. Summarize overall findings
            in your tracked review comment. If the diff looks good, say so.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"

      # ---- Lever 5 (lightest): surface the review CONTEXT, not just the diff ----
      # Keep the agent's full transcript as a downloadable artifact, and drop a
      # link to the review conversation into #all-caiso-code. Both run even if the
      # review step fails, so the context is always inspectable.
      - name: Upload review transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-transcript-pr${{ github.event.pull_request.number }}
          path: ${{ steps.review.outputs.execution_file }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Post review context to Slack (#all-caiso-code)
        if: always()
        env:
          SLACK_ALLCHAN_WEBHOOK: ${{ secrets.SLACK_ALLCHAN_WEBHOOK }}
          PR: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_ALLCHAN_WEBHOOK:-}" ]; then
            echo "SLACK_ALLCHAN_WEBHOOK not set; skipping"; exit 0
          fi
          TEXT=":microscope: *Claude reviewed PR #${PR}* — the full agent conversation (the real work behind the diff):\n• <${PR_URL}|PR #${PR} + inline review>\n• <${RUN_URL}|run log + transcript artifact>"
          curl -s -X POST -H 'Content-Type: application/json' \
            --data "{\"text\": \"${TEXT}\"}" "$SLACK_ALLCHAN_WEBHOOK"
