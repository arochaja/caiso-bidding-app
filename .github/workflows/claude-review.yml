name: Claude Code Review

# Lever 3: automatic AI code review of pull requests — no @claude mention needed.
# Posts a summary (via the tracked review comment) + inline line comments.
#
# Scope is correctness/security only — ruff (Lever 1) owns style, and the local
# Stop-hook review (Lever 2) covers work-in-progress on branches.
#
# NOTE: claude-code-action@v1 only runs when this file exists with IDENTICAL
# content on the default branch (GitHub security validation) — keep main + PR
# branch in sync. `track_progress: true` is required: it wires up the
# comment-posting path (without it, posting tools are permission-denied).
# The mention-triggered workflow lives in claude.yml (unchanged).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  pr-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          classify_inline_comments: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Perform a code review of this pull request. Run `gh pr diff` to fetch
            the diff, then review it as a meticulous senior engineer on a Python
            data app (Streamlit + DuckDB).

            Focus ONLY on things that need judgment:
            1. Real correctness bugs and wrong assumptions
            2. Security issues — unsafe SQL, unvalidated input
            3. Silent data loss and edge-case / off-by-one errors
            Do NOT comment on style or formatting — ruff already enforces those.

            Post inline comments on the specific problem lines using the inline
            comment tool, with concrete suggestions. Summarize overall findings
            in your tracked review comment. If the diff looks good, say so.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
