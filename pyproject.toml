[tool.ruff]
# The dashboard and pipeline are data-heavy scripts with long SQL / markdown
# strings, so we give lines a little more room than the 88-col default.
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# "Safe lint": real bugs and modern-syntax nudges, not opinionated style.
#   E4/E7/E9  pycodestyle errors (imports, comparisons, bare except, syntax)
#   F         pyflakes  (undefined names, unused imports)
#   I         import sorting
#   B         flake8-bugbear (likely bugs)
#   UP        pyupgrade (modern Python idioms)
#   S         flake8-bandit (security: SQL injection, eval, subprocess, ...)
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "S"]
ignore = [
    "E501",  # line length is the formatter's job, not a lint gate
    "E701",  # compact one-liner defs/ifs are a deliberate style here
    "E702",  # multiple statements on one line (semicolon) — same
]

[tool.ruff.lint.per-file-ignores]
# pipeline.py is a trusted offline ETL run by hand: its SQL is built from
# internal constants (paths, percentile thresholds), never from user input,
# so the SQL-injection rule (S608) would only produce false positives here.
# S608 stays ACTIVE for dashboard.py, where Streamlit inputs could reach SQL.
"app/pipeline.py" = ["S608"]
# Local automation (the Lever 2 review hook): intentionally invokes known tools
# (git, claude) by name and POSTs to a validated Slack webhook URL. These are
# trusted, developer-run scripts, not request handlers.
".claude/hooks/*.py" = ["S603", "S607", "S310"]
